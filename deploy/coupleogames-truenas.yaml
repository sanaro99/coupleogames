services:
  coupleogames:
    image: ${COUPLEOGAMES_IMAGE:?Set an approved immutable sha-tagged image}
    restart: unless-stopped
    user: "568:568"
    env_file:
      - /mnt/apps-pool/appconfig/coupleogames.env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3001"
      DATABASE_PATH: /app/data/coupleogames.sqlite
    ports:
      - "127.0.0.1:18081:3001"
    volumes:
      - /mnt/apps-pool/coupleogames:/app/data
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
